# =============================================================
# PostgreSQL 17 — Docker/Podman Compose
#
# BIND_ADDRESS — Controla la interfaz de red donde se expone el puerto:
#
#   127.0.0.1          → Solo acceso local desde esta máquina
#                        (recomendado para desarrollo local)
#
#   <IP-de-tu-PC>      → Acceso desde tu red local (LAN)
#                        Ej: 192.168.1.100
#                        Útil si tenés otra PC o dispositivo en la misma
#                        red que necesita conectarse a esta base de datos.
#
#   0.0.0.0            → Todas las interfaces (no recomendado)
#                        Solo usar si el contenedor está en una VM
#                        (VMware/VirtualBox) o VPS y necesitás acceso
#                        remoto desde otra máquina. En este caso,
#                        asegurate de configurar el firewall del SO
#                        para filtrar IPs y puertos.
#
#   Nota para VMs (VMware/VirtualBox):
#   Si usás modo "Bridged", el contenedor se ve desde otras máquinas
#   como un dispositivo más de la red. Usá la IP de la VM.
#   Si usás modo "NAT", necesitás port forwarding del host a la VM.
# =============================================================

# podman-compose: evita pods sin infra, que pueden fallar al limpiar
# la red rootless (pasta) durante stop/down.
x-podman:
  in_pod: false

services:

  postgresql17_init:
    image: docker.io/library/busybox:1.37.0
    user: "0"
    profiles:
      - postgresql17
    command:
      - sh
      - -c
      - |
        mkdir -p /mnt/data /mnt/backup /mnt/log
        chown -R 999:999 /mnt/data /mnt/backup /mnt/log
    volumes:
      - postgresql17_data:/mnt/data
      - postgresql17_backup:/mnt/backup
      - postgresql17_log:/mnt/log

  postgresql17:
    image: docker.io/library/postgres:17.11-bookworm
    container_name: postgresql17
    hostname: postgresql17
    restart: ${RESTART_POLICY:-no}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}
    depends_on:
      postgresql17_init:
        condition: service_completed_successfully
    profiles:
      - postgresql17
    command: ["sh", "-c", "sed \"s|__POSTGRES_ALLOWED_CIDR__|$${POSTGRES_ALLOWED_CIDR}|\" /etc/postgresql/pg_hba.conf > /tmp/pg_hba.conf && exec /usr/local/bin/docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/tmp/pg_hba.conf"]
    ports:
      - "${BIND_ADDRESS}:5433:5432"
    volumes:
      - postgresql17_data:/var/lib/postgresql/data
      - postgresql17_backup:/var/lib/postgresql/backup
      - postgresql17_log:/var/log/postgresql
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro,Z
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,Z
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_ALLOWED_CIDR: ${POSTGRES_ALLOWED_CIDR:-172.16.0.0/12}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "1.5"
        reservations:
          memory: 256M
          cpus: "0.25"

volumes:
  postgresql17_data:
    name: postgresql17_data
  postgresql17_backup:
    name: postgresql17_backup
  postgresql17_log:
    name: postgresql17_log
