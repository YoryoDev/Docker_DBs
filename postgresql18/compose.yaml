# =============================================================
# PostgreSQL 18 — Docker Compose
#
# BIND_ADDRESS — Controla la interfaz de red donde se expone el puerto:
#
#   127.0.0.1          → Solo acceso local desde esta máquina
#                        (recomendado para desarrollo local)
#
#   <IP-de-tu-PC>      → Acceso desde tu red local (LAN)
#                        Ej: 192.168.1.100
#                        Útil si tenés otra PC o dispositivo en la misma
#                        red que necesita conectarse a esta base de datos.
#
#   0.0.0.0            → Todas las interfaces (no recomendado)
#                        Solo usar si el contenedor está en una VM
#                        (VMware/VirtualBox) o VPS y necesitás acceso
#                        remoto desde otra máquina. En este caso,
#                        asegurate de configurar el firewall del SO
#                        para filtrar IPs y puertos.
#
#   Nota para VMs (VMware/VirtualBox):
#   Si usás modo "Bridged", el contenedor se ve desde otras máquinas
#   como un dispositivo más de la red. Usá la IP de la VM.
#   Si usás modo "NAT", necesitás port forwarding del host a la VM.
# =============================================================

services:

  postgresql18_init:
    image: busybox:1
    user: "0"
    profiles:
      - postgresql18
    command:
      - sh
      - -c
      - |
        mkdir -p /mnt/postgresql /mnt/backup /mnt/log
        chown -R 999:999 /mnt/postgresql /mnt/backup /mnt/log
    volumes:
      - postgresql18_data:/mnt/postgresql
      - postgresql18_backup:/mnt/backup
      - postgresql18_log:/mnt/log

  postgresql:
    image: postgres:18
    container_name: postgresql18
    hostname: postgresql18
    restart: no
    depends_on:
      postgresql18_init:
        condition: service_completed_successfully
    profiles:
      - postgresql18
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "${BIND_ADDRESS}:5432:5432"
    volumes:
      - postgresql18_data:/var/lib/postgresql
      - postgresql18_backup:/var/lib/postgresql/backup
      - postgresql18_log:/var/log/postgresql
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "1.5"
        reservations:
          memory: 256M
          cpus: "0.25"

volumes:
  postgresql18_data:
    name: postgresql18_data
  postgresql18_backup:
    name: postgresql18_backup
  postgresql18_log:
    name: postgresql18_log
