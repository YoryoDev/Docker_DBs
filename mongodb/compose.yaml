# =============================================================
# MongoDB 8.0 — Docker Compose
#
# BIND_ADDRESS — Controla la interfaz de red donde se expone el puerto:
#
#   127.0.0.1          → Solo acceso local desde esta máquina
#                        (recomendado para desarrollo local)
#
#   <IP-de-tu-PC>      → Acceso desde tu red local (LAN)
#                        Ej: 192.168.1.100
#                        Útil si tenés otra PC o dispositivo en la misma
#                        red que necesita conectarse a esta base de datos.
#
#   0.0.0.0            → Todas las interfaces (no recomendado)
#                        Solo usar si el contenedor está en una VM
#                        (VMware/VirtualBox) o VPS y necesitás acceso
#                        remoto desde otra máquina. En este caso,
#                        asegurate de configurar el firewall del SO
#                        para filtrar IPs y puertos.
#
#   Nota para VMs (VMware/VirtualBox):
#   Si usás modo "Bridged", el contenedor se ve desde otras máquinas
#   como un dispositivo más de la red. Usá la IP de la VM.
#   Si usás modo "NAT", necesitás port forwarding del host a la VM.
# =============================================================

services:

  mongodb_init:
    image: busybox:latest
    user: "0"
    profiles:
      - mongodb
    command:
      - sh
      - -c
      - |
        mkdir -p /mnt/data /mnt/backup /mnt/log
        chown -R 999:999 /mnt/data /mnt/backup /mnt/log
    volumes:
      - mongodb_data:/mnt/data
      - mongodb_backup:/mnt/backup
      - mongodb_log:/mnt/log

  mongodb:
    image: mongo:8.0.20
    container_name: mongodb8
    hostname: mongodb8
    restart: no
    depends_on:
      mongodb_init:
        condition: service_completed_successfully
    profiles:
      - mongodb
    ports:
      - "${BIND_ADDRESS}:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_backup:/data/backup
      - mongodb_log:/var/log/mongodb
      - ./config/mongod.conf:/etc/mongod.conf:ro
    command: mongod --config /etc/mongod.conf
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"

volumes:
  mongodb_data:
    name: mongodb_data
  mongodb_backup:
    name: mongodb_backup
  mongodb_log:
    name: mongodb_log

