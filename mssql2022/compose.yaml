# =============================================================
# SQL Server 2022 — Docker Compose
#
# BIND_ADDRESS — Controla la interfaz de red donde se expone el puerto:
#
#   127.0.0.1          → Solo acceso local desde esta máquina
#                        (recomendado para desarrollo local)
#
#   <IP-de-tu-PC>      → Acceso desde tu red local (LAN)
#                        Ej: 192.168.1.100
#                        Útil si tenés otra PC o dispositivo en la misma
#                        red que necesita conectarse a esta base de datos.
#
#   0.0.0.0            → Todas las interfaces (no recomendado)
#                        Solo usar si el contenedor está en una VM
#                        (VMware/VirtualBox) o VPS y necesitás acceso
#                        remoto desde otra máquina. En este caso,
#                        asegurate de configurar el firewall del SO
#                        para filtrar IPs y puertos.
#
#   Nota para VMs (VMware/VirtualBox):
#   Si usás modo "Bridged", el contenedor se ve desde otras máquinas
#   como un dispositivo más de la red. Usá la IP de la VM.
#   Si usás modo "NAT", necesitás port forwarding del host a la VM.
# =============================================================

services:

  mssql2022_init:
    image: busybox:1
    user: "0"
    profiles:
      - mssql2022
    command:
      - sh
      - -c
      - |
        mkdir -p /mnt/data /mnt/backup /mnt/jobs /mnt/log
        chown -R 10001:0 /mnt/data /mnt/backup /mnt/jobs /mnt/log
    volumes:
      - mssql2022_data:/mnt/data
      - mssql2022_backup:/mnt/backup
      - mssql2022_jobs:/mnt/jobs
      - mssql2022_log:/mnt/log

  mssql2022:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver22
    hostname: sqlserver22
    restart: no
    depends_on:
      mssql2022_init:
        condition: service_completed_successfully
    profiles:
      - mssql2022
    ports:
      - "${BIND_ADDRESS}:1434:1433"
    volumes:
      - mssql2022_data:/var/opt/mssql/data
      - mssql2022_backup:/var/opt/mssql/backup
      - mssql2022_jobs:/var/opt/mssql/jobs
      - mssql2022_log:/var/opt/mssql/log
      - ./config/mssql.conf:/var/opt/mssql/mssql.conf:ro
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_COLLATION: "Latin1_General_100_CI_AS_SC"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -No -l 5"]
      interval: 15s
      timeout: 10s
      retries: 5
      # Primera ejecución: SQL Server 2022 aplica collation Latin1_General_100_CI_AS_SC
      # (distinto al default de 2022) y hace un restart interno que puede tardar ~3-5 min
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"
        reservations:
          memory: 256M
          cpus: "0.5"

volumes:
  mssql2022_data:
    name: mssql2022_data
  mssql2022_backup:
    name: mssql2022_backup
  mssql2022_jobs:
    name: mssql2022_jobs
  mssql2022_log:
    name: mssql2022_log
