# =============================================================
# Oracle 19c — Docker Compose
#
# BIND_ADDRESS — Controla la interfaz de red donde se expone el puerto:
#
#   127.0.0.1          → Solo acceso local desde esta máquina
#                        (recomendado para desarrollo local)
#
#   <IP-de-tu-PC>      → Acceso desde tu red local (LAN)
#                        Ej: 192.168.1.100
#                        Útil si tenés otra PC o dispositivo en la misma
#                        red que necesita conectarse a esta base de datos.
#
#   0.0.0.0            → Todas las interfaces (no recomendado)
#                        Solo usar si el contenedor está en una VM
#                        (VMware/VirtualBox) o VPS y necesitás acceso
#                        remoto desde otra máquina. En este caso,
#                        asegurate de configurar el firewall del SO
#                        para filtrar IPs y puertos.
#
#   Nota para VMs (VMware/VirtualBox):
#   Si usás modo "Bridged", el contenedor se ve desde otras máquinas
#   como un dispositivo más de la red. Usá la IP de la VM.
#   Si usás modo "NAT", necesitás port forwarding del host a la VM.
# =============================================================

services:

  oracle19c_login:
    image: docker:cli
    user: "0"
    profiles:
      - oracle19c
    environment:
      ORACLE_REGISTRY_USER: ${ORACLE_REGISTRY_USER}
      ORACLE_REGISTRY_PASS: ${ORACLE_REGISTRY_PASS}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker:/root/.docker
    command:
      - sh
      - -c
      - |
        echo "${ORACLE_REGISTRY_PASS}" | docker login container-registry.oracle.com \
          -u "${ORACLE_REGISTRY_USER}" --password-stdin

  oracle19c_init:
    image: busybox:latest
    user: "0"
    profiles:
      - oracle19c
    depends_on:
      oracle19c_login:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - |
        mkdir -p /mnt/data /mnt/backup /mnt/log
        chown -R 54321:54321 /mnt/data /mnt/backup /mnt/log
    volumes:
      - oracle19c_data:/mnt/data
      - oracle19c_backup:/mnt/backup
      - oracle19c_log:/mnt/log

  oracle19c:
    # ─────────────────────────────────────────────────────────────────────
    # REQUISITO PREVIO — Solo la primera vez, antes de hacer up:
    #   1. Crea cuenta en https://container-registry.oracle.com
    #   2. Navega a Database → enterprise y acepta la licencia OTN.
    #   3. En el portal ve a tu perfil → "Auth Token" → genera una
    #      secret key (úsala como ORACLE_REGISTRY_PASS, NO la del SSO).
    #   4. Rellena ORACLE_REGISTRY_USER y ORACLE_REGISTRY_PASS en .env.
    #   El login se ejecuta automáticamente al hacer `docker compose up`.
    # ─────────────────────────────────────────────────────────────────────
    image: container-registry.oracle.com/database/enterprise:19.3.0.0
    container_name: oracle19c
    hostname: oracle19c
    restart: no
    depends_on:
      oracle19c_init:
        condition: service_completed_successfully
    profiles:
      - oracle19c
    ports:
      - "${BIND_ADDRESS}:1521:1521"
      - "${BIND_ADDRESS}:5500:5500"
    volumes:
      - oracle19c_data:/opt/oracle/oradata
      - oracle19c_backup:/opt/oracle/backup
      - oracle19c_log:/opt/oracle/diag/rdbms/orclcdb/ORCLCDB/trace
      - ./config/setup:/opt/oracle/scripts/setup:ro
      - ./config/startup:/opt/oracle/scripts/startup:ro
    # Oracle 19c en contenedor se configura por variables de entorno en la
    # creación inicial de la base de datos. Los ajustes post-creación van
    # en config/setup/ (una sola vez) y config/startup/ (cada arranque).
    #
    # Nota sobre logs: Los trace files y alert log se guardan en ./log/
    # para acceso directo desde el host. La ruta dentro del contenedor
    # depende de ORACLE_SID (por defecto: ORCLCDB).
    environment:
      ORACLE_SID: ${ORACLE_SID}
      ORACLE_PDB: ${ORACLE_PDB}
      ORACLE_PWD: ${ORACLE_PWD}
      ORACLE_CHARACTERSET: ${ORACLE_CHARACTERSET}
      INIT_SGA_SIZE: ${INIT_SGA_SIZE}
      INIT_PGA_SIZE: ${INIT_PGA_SIZE}
      ENABLE_ARCHIVELOG: ${ENABLE_ARCHIVELOG:-false}
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -S / as sysdba 2>/dev/null | grep -q 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 900s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

volumes:
  oracle19c_data:
    name: oracle19c_data
  oracle19c_backup:
    name: oracle19c_backup
  oracle19c_log:
    name: oracle19c_log
