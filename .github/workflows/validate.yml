name: Docker DBs validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install shell tools
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Validate shell syntax
        shell: bash
        run: bash -n .bash_aliases
      - name: Validate Compose and helpers
        shell: bash
        run: python tests/test_setup.py
      - name: Validate production overlays
        shell: bash
        run: |
          set -euo pipefail
          for project in mariadb mongodb mssql2022 mssql2025 mysql postgresql17 postgresql18; do
            env_file=$(mktemp)
            grep -E '^[A-Z_]+=' "$project/.env.example" > "$env_file"
            docker compose -f "$project/compose.yaml" -f "$project/compose.production.yaml" \
              --env-file "$env_file" --profile "$project" config --quiet
            rm -f "$env_file"
          done
      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all -- tests/__pycache__ '*.pyc')"
          git diff --check
          ! git grep -n -I -E '(^|[^A-Za-z])(password|secret|token|api[_-]?key)[[:space:]]*[:=][[:space:]]*[^$#[:space:]]' -- ':!*.example' ':!README.md' ':!AGENTS.md'
